<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards - Ayvu Translator</title>
    <link rel="stylesheet" href="./flashcards.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="header-search-wrap">
          <input id="searchInput" type="search" placeholder="Buscar palavra ou tradução" autocomplete="off" />
        </div>
        <div class="header-meta">
          <p id="counter" class="counter">0 de 0</p>
          <button id="exportTopBtn" class="ghost-icon-btn" type="button" title="Export CSV" aria-label="Export CSV">
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 4v10" />
              <path d="M8 11l4 4 4-4" />
              <path d="M4 18h16" />
            </svg>
          </button>
        </div>
      </header>

      <nav id="sections" class="sections" aria-label="Decks"></nav>

      <section class="study-stage" aria-label="Modo de estudo">
        <div class="card-container">
          <button id="card" class="card hidden" type="button" aria-live="polite">
            <span class="card-face card-front">
              <span id="frontLabel" class="label">Front</span>
              <span id="frontText" class="text"></span>
              <span class="flip-hint">Click to flip</span>
            </span>

            <span class="card-face card-back">
              <span id="backLabel" class="label">Back</span>
              <span id="backText" class="text"></span>
              <span id="metaText" class="meta"></span>
            </span>
          </button>
          <div id="emptyState" class="empty">
            Nenhuma palavra salva ainda.
          </div>
        </div>
      </section>

      <footer class="bottom-toolbar" aria-label="Flashcard actions">
        <button id="prevBtn" class="icon-btn" type="button" title="Previous" aria-label="Previous">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <button id="pronounceCardBtn" class="icon-btn" type="button" title="Pronounce word" aria-label="Pronounce word">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 10v4" />
            <path d="M8 10l5-4v12l-5-4z" />
            <path d="M16 9a4 4 0 010 6" />
            <path d="M18 7a7 7 0 010 10" />
          </svg>
        </button>
        <button id="youglishCardBtn" class="icon-btn" type="button" title="YouGlish" aria-label="YouGlish">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 6l10 6-10 6z" />
          </svg>
        </button>
        <button id="exportCardsBtn" class="icon-btn" type="button" title="Export CSV" aria-label="Export CSV">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 4v10" />
            <path d="M8 11l4 4 4-4" />
            <path d="M4 18h16" />
          </svg>
        </button>
        <button id="removeBtn" class="icon-btn danger-action" type="button" title="Remove current" aria-label="Remove current">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 7h12" />
            <path d="M9 7V5h6v2" />
            <path d="M8 7l1 12h6l1-12" />
            <path d="M10 11v5" />
            <path d="M14 11v5" />
          </svg>
        </button>
        <button id="nextBtn" class="icon-btn" type="button" title="Next" aria-label="Next">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 6l6 6-6 6" />
          </svg>
        </button>
      </footer>

      <p id="status" class="status"></p>
    </main>

    <script src="./shared/utils.js"></script>
    <script src="./shared/language.js"></script>
    <script src="./flashcards.js"></script>
  </body>
</html>
