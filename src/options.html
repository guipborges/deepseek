<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações - Ayvu</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="app">
      <h1>Configurações</h1>

      <section class="account-box" aria-label="Conta">
        <div>
          <strong id="accountStatusText">Conta nao conectada</strong>
          <span id="accountUsageText">Entre pelo popup para ativar o trial.</span>
        </div>
        <div class="account-actions">
          <div id="usageRing" class="usage-ring hidden" role="meter" aria-label="Uso mensal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="usageRingText">0%</span>
          </div>
          <button id="logoutBtn" class="secondary-btn" type="button">Sair</button>
        </div>
      </section>

      <label for="targetLanguage">Idioma de destino</label>
      <select id="targetLanguage"></select>

      <label for="popupWidth">Largura do popup (px)</label>
      <input id="popupWidth" type="number" value="340" min="280" max="780" />

      <label for="popupHeight">Altura do popup (px)</label>
      <input id="popupHeight" type="number" value="520" min="260" max="780" />

      <label for="themeMode">Tema</label>
      <select id="themeMode">
        <option value="light">Claro</option>
        <option value="dark">Escuro</option>
      </select>


      <label for="appLanguage">Lingua do app</label>
      <select id="appLanguage">
        <option value="en-US">English</option>
        <option value="pt-BR">Portugues</option>
        <option value="de-DE">Deutsch</option>
      </select>

      <fieldset class="trigger-mode-fieldset" id="popupOpenTriggerFieldset">
        <legend id="popupOpenTriggerLegend">Abertura do popup principal</legend>
        <label class="checkbox-row" for="openOnTClick">
          <input id="openOnTClick" name="popupOpenTrigger" type="radio" value="t-click" checked />
          Abre popup ao clicar no T
        </label>
        <label class="checkbox-row" for="openOnDoubleClick">
          <input id="openOnDoubleClick" name="popupOpenTrigger" type="radio" value="double-click" />
          Abre popup so com duplo clique na palavra
        </label>
      </fieldset>

      <div class="buttons">
        <button id="saveBtn" type="button">Salvar</button>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script src="./shared/utils.js"></script>
    <script src="./shared/language.js"></script>
    <script src="./auth.js"></script>
    <script src="./options.js"></script>
  </body>
</html>
