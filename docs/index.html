<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Chrome Translator</title>
    <style>
      :root {
        --bg: #f5f8ff;
        --card: #ffffff;
        --text: #1f2a44;
        --muted: #5c6784;
        --line: #d8e1f2;
        --brand: #1d4ed8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top right, #e8efff, var(--bg));
      }

      .container {
        max-width: 860px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 10px 24px rgba(31, 42, 68, 0.06);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.9rem;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      a.button {
        display: inline-block;
        text-decoration: none;
        background: var(--brand);
        color: #fff;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
      }

      a.link {
        color: var(--brand);
        text-decoration: none;
        font-weight: 600;
      }

      footer {
        margin-top: 16px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>DeepSeek Chrome Translator</h1>
        <p>
          Official public page for extension policy and publication support.
          Use the privacy policy URL below in your Chrome Web Store listing.
        </p>

        <div class="actions">
          <a class="button" href="./privacy-policy.html">Open Privacy Policy</a>
        </div>

        <p>
          Direct URL: <a class="link" href="./privacy-policy.html">privacy-policy.html</a>
        </p>

        <footer>
          Maintainer: update this page with your support contact before publishing.
        </footer>
      </section>
    </main>
  </body>
</html>
